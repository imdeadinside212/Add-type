name: Build and Release

# Chay moi khi ban push 1 tag dang v1.2.0, v2.0.1, ...
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build exe
        run: |
          pyinstaller --onefile --windowed --name "Add type" --icon icon.ico --add-data "icon.ico;." main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: "dist/Add type.exe"

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # Dung chung 1 file main.py voi ban Windows -- code da tu re nhanh
      # theo sys.platform ben trong (COM tren Windows, AppleScript tren Mac)
      - name: Build app
        run: |
          if [ -f icon.icns ]; then
            pyinstaller --onefile --windowed --name "Add type" --icon icon.icns --add-data "icon.icns:." main.py
          else
            pyinstaller --onefile --windowed --name "Add type" main.py
          fi

      - name: Zip .app bundle
        run: |
          cd dist
          zip -r "Add type-mac.zip" "Add type.app"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-build
          path: "dist/Add type-mac.zip"

  release:
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: mac-build
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Add type.exe
            dist/Add type-mac.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
